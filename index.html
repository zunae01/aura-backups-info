<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Information about the private Aura Backups utility.">
  <title>Aura Backups</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #090b0a; color: #edf5ef; }
    main { width: min(680px, calc(100% - 40px)); padding: 48px; border: 1px solid #29322c; background: #0f1311; }
    .eyebrow { color: #9bc9aa; font-size: .75rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 12px 0 18px; font-size: clamp(2.4rem, 7vw, 4.6rem); line-height: .95; }
    p { color: #b8c2bb; font-size: 1.05rem; line-height: 1.7; }
    a { color: #b9e6c7; }
    footer { margin-top: 36px; padding-top: 20px; border-top: 1px solid #29322c; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Private utility</div>
    <h1>Aura Backups</h1>
    <p>Aura Backups is a private, personal backup utility used by its owner to copy server backups to the owner’s Google Drive.</p>
    <p>It is not offered as a public service and does not provide accounts or access to other users.</p>
    <footer><a href="privacy.html">Privacy policy</a></footer>
  </main>
</body>
</html>
